services:
  tiktok-scraper:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - follow-ups-data:/app/data
    environment:
      - PORT=8000
      # Optional, only if TikTok is blocked where you run or at high volume.
      # - TIKTOK_PROXY=******host:port

volumes:
  follow-ups-data:
